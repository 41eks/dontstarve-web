name: Instanced atlas memory (n100)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  measure:
    runs-on: [self-hosted, linux, x64, n100]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: pnpm --filter @dontstarve-web/ui exec playwright install --only-shell chromium

      - name: Measure Master and Caves
        id: measure
        shell: bash
        run: |
          port=$(node --input-type=module <<'NODE'
          import { createServer } from 'node:net';
          const server = createServer();
          server.listen(0, '127.0.0.1', () => {
            console.log(server.address().port);
            server.close();
          });
          NODE
          )
          report="$RUNNER_TEMP/instanced-atlas-memory.json"
          node scripts/instanced-atlas-memory.mjs --port "$port" \
            --save Cluster_1/Master.json --save Cluster_1/Caves.json --json > "$report"

          node --input-type=module - "$report" <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const results = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const mib = bytes => bytes === undefined ? '—' : (bytes / 1024 ** 2).toFixed(1);
          const lines = [
            `WebGL renderer: ${results[0].gl ?? 'Unavailable'}`,
            '',
            '| Save | Load (s) | Atlas at settle (MiB) | Atlas peak (MiB) | GPU process RSS peak (MiB) |',
            '| --- | ---: | ---: | ---: | ---: |',
          ];
          for (const result of results) {
            const settled = result.appearances.reduce((sum, appearance) => sum + appearance.bytes, 0);
            const load = result.loadMs === undefined ? 'Incomplete' : (result.loadMs / 1000).toFixed(1);
            const gpuPeak = result.processes.peaks['gpu-process']?.bytes;
            lines.push(`| ${result.save} | ${load} | ${mib(settled)} | ${mib(result.peak.bytes)} | ${mib(gpuPeak)} |`);
            for (const problem of result.problems) {
              console.error(`${result.save}: ${problem}`);
            }
            if (result.loadMs === undefined || result.problems.length > 0) {
              process.exitCode = 1;
            }
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Upload full report
        if: ${{ !cancelled() && (steps.measure.outcome == 'success' || steps.measure.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: n100-instanced-atlas-memory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/instanced-atlas-memory.json
          if-no-files-found: error
