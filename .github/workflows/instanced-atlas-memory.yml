name: Instanced atlas memory (n100)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  measure:
    runs-on: [self-hosted, linux, x64, n100]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: pnpm --filter @dontstarve-web/ui exec playwright install --no-shell chromium

      - name: Measure Master and Caves
        id: measure
        shell: bash
        run: |
          port=$(node --input-type=module <<'NODE'
          import { createServer } from 'node:net';
          const server = createServer();
          server.listen(0, '127.0.0.1', () => {
            console.log(server.address().port);
            server.close();
          });
          NODE
          )
          mkdir -p analysis/ci
          report=analysis/ci/instanced-atlas-memory-n100
          node scripts/instanced-atlas-memory.mjs --port "$port" --hardware \
            --save Cluster_1/Master.json --save Cluster_1/Caves.json --report "$report.md" --json > "$report.json"
          cat "$report.md" >> "$GITHUB_STEP_SUMMARY"

          node --input-type=module - "$report.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const results = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          for (const result of results) {
            for (const problem of result.problems) {
              console.error(`${result.save}: ${problem}`);
            }
            if (!result.gl?.includes('Intel')) {
              console.error(`${result.save}: expected Intel WebGL, got ${result.gl ?? 'unavailable'}`);
              process.exitCode = 1;
            }
            if (result.loadMs === undefined || !result.frameTiming?.frames || result.problems.length > 0) {
              process.exitCode = 1;
            }
          }
          NODE

      - name: Upload reports
        if: ${{ !cancelled() && (steps.measure.outcome == 'success' || steps.measure.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: n100-instanced-atlas-memory-${{ github.run_attempt }}
          path: |
            analysis/ci/instanced-atlas-memory-n100.md
            analysis/ci/instanced-atlas-memory-n100.json
          if-no-files-found: error
